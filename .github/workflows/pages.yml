name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare site from zip
        run: |
          set -e
          rm -rf _site
          mkdir -p _site
          if [ -f index.html ]; then cp index.html _site/; fi

          found=0
          for z in *.zip; do
            [ -e "$z" ] || continue
            rm -rf /tmp/unz
            mkdir -p /tmp/unz
            unzip -oq "$z" -d /tmp/unz

            asset_dir=$(find /tmp/unz -maxdepth 3 -type d -name assets | head -n 1)
            if [ -n "$asset_dir" ]; then
              mkdir -p _site/assets
              cp -R "$asset_dir"/. _site/assets/
              found=1
            elif [ -d /tmp/unz/img ] || [ -d /tmp/unz/cases ] || [ -d /tmp/unz/js ]; then
              mkdir -p _site/assets
              cp -R /tmp/unz/. _site/assets/
              found=1
            fi

            if [ -f /tmp/unz/index.html ]; then
              cp /tmp/unz/index.html _site/index.html
              found=1
            fi

            site_index=$(find /tmp/unz -maxdepth 2 -type f -name index.html | head -n 1)
            if [ -n "$site_index" ] && [ "$site_index" != "/tmp/unz/index.html" ]; then
              cp "$site_index" _site/index.html
              found=1
            fi
          done

          if [ "$found" -eq 0 ]; then
            echo "未找到可用的压缩包或 index.html"
            exit 1
          fi
          if [ ! -f _site/index.html ]; then
            echo "压缩包内没有 index.html，请同时上传入口文件"
            exit 1
          fi
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
